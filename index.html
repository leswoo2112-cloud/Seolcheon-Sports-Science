<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,initial-scale=1.0">

    <title>

        설천고 스포츠과학센터 PRO

    </title>

    <link rel="stylesheet"
          href="style.css">

    <script
        src="https://cdn.jsdelivr.net/npm/chart.js">
    </script>

    <script
        src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js">
    </script>

    <script
        src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js">
    </script>

    <script
        src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js">
    </script>

</head>

<body>

<header>

    <h1>

        설천고 스포츠과학센터 PRO

    </h1>

</header>

<main>

<section class="camera-panel">

    <video

        id="cameraVideo"

        autoplay

        playsinline>

    </video>

    <canvas

        id="poseCanvas">

    </canvas>

</section>

<section class="control-panel">

    <button id="startCamera">

        카메라 시작

    </button>

    <button id="stopCamera">

        카메라 종료

    </button>

    <button id="captureButton">

        캡처

    </button>

    <button id="saveButton">

        저장

    </button>

</section>
<section class="dashboard-panel">

    <div class="card">

        <h3>AI 점수</h3>

        <h1 id="reportScore">

            0

        </h1>

    </div>

    <div class="card">

        <h3>등급</h3>

        <h1 id="reportGrade">

            -

        </h1>

    </div>

    <div class="card">

        <h3>부상 위험</h3>

        <h1 id="reportRisk">

            안전

        </h1>

    </div>

    <div class="card">

        <h3>국가대표 비교</h3>

        <h1 id="nationalPercent">

            0%

        </h1>

    </div>

</section>

<section class="analysis-panel">

    <div class="chart-card">

        <canvas

            id="reportChart">

        </canvas>

    </div>

    <div class="chart-card">

        <canvas

            id="nationalChart">

        </canvas>

    </div>

</section>

<section class="feedback-panel">

    <h2>

        AI 피드백

    </h2>

    <div id="reportFeedback">

    </div>

</section>

<section class="recommend-panel">

    <h2>

        추천 훈련

    </h2>

    <div id="recommendation">

    </div>

</section>

<section class="athlete-panel">

    <h2>

        선수 정보

    </h2>

    <table>

        <tr>

            <td>이름</td>

            <td id="athleteName">

                -

            </td>

        </tr>

        <tr>

            <td>종목</td>

            <td id="athleteSport">

                -

            </td>

        </tr>

        <tr>

            <td>나이</td>

            <td id="athleteAge">

                -

            </td>

        </tr>

        <tr>

            <td>신장</td>

            <td id="athleteHeight">

                -

            </td>

        </tr>

        <tr>

            <td>체중</td>

            <td id="athleteWeight">

                -

            </td>

        </tr>

    </table>

</section>
<section class="sports-panel">

    <h2>

        종목 선택

    </h2>

    <div id="selectedSport">

        바이애슬론

    </div>

    <div id="sportsList"

         class="sports-grid">

    </div>

</section>

<section class="ranking-panel">

    <h2>

        선수 랭킹

    </h2>

    <div id="rankingList">

    </div>

</section>

<section class="history-panel">

    <h2>

        최근 분석 기록

    </h2>

    <div id="recentAnalysis">

    </div>

</section>

<section class="training-panel">

    <h2>

        오늘 훈련

    </h2>

    <div>

        훈련 횟수 :

        <span id="todayTraining">

            0

        </span>

    </div>

</section>

<section class="summary-panel">

    <div class="summary-card">

        <h3>

            평균 점수

        </h3>

        <h1 id="averageScore">

            0

        </h1>

    </div>

    <div class="summary-card">

        <h3>

            별점

        </h3>

        <h1 id="starScore">

            ☆☆☆☆☆

        </h1>

    </div>

    <div class="summary-card">

        <h3>

            AI 코멘트

        </h3>

        <p id="aiComment">

            분석 대기 중...

        </p>

    </div>

</section>

<section id="reportArea">

</section>

<footer>

    <p>

        © 2026 Seolcheon Sports Science Center PRO

    </p>

</footer>

<script type="module"

        src="main.js">

</script>

</main>

</body>

</html>
